name: Update Beacon cask

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read latest Beacon release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-cask.sh
      - name: Commit an updated cask
        run: |
          if git diff --quiet -- Casks/beacon.rb; then
            echo "Cask is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/beacon.rb
          git commit -m "Update Beacon cask"
          git push
